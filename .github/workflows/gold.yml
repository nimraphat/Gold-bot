name: gold-signal

on:
  schedule:
    # ทุก 15 นาที (นาทีที่ 2,17,32,47 หลังแท่ง M15 ปิด) จันทร์-ศุกร์ เวลา UTC
    - cron: "2,17,32,47 * * * 1-5"
  workflow_dispatch:   # กดรันเองจากหน้าเว็บ/มือถือเพื่อทดสอบ

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy yfinance
      - run: python scan_once.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
